<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061326">
  <meta http-equiv="refresh" content="2;url=./roles-portal.html">
  <title>MOI MARKET PRO — Вход в систему</title>
  <script>
    (() => {
      const target = new URL('./roles-portal.html', document.baseURI).href;
      const go = () => { if (location.href !== target) location.replace(target); };
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {}).finally(go);
      } else {
        go();
      }
      setTimeout(go, 1400);
    })();
  </script>
</head>
<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#041124;color:#eef7ff;font:16px system-ui,sans-serif">
  <main style="text-align:center;padding:28px">
    <p style="font-weight:800;letter-spacing:.06em">MOI MARKET <span style="color:#27d7ff">PRO</span></p>
    <p>Вход в систему и выбор роли открываются…</p>
    <p><a style="color:#27d7ff" href="./roles-portal.html">Открыть вручную</a></p>
  </main>
</body>
</html>
